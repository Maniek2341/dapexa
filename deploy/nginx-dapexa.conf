upstream dapexa_app {
    server unix:/run/dapexa/gunicorn.sock;
}

server {
    listen 80;
    server_name %PUBLIC_DOMAIN% %PANEL_DOMAIN%;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name %PUBLIC_DOMAIN%;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/%PUBLIC_DOMAIN%/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/%PUBLIC_DOMAIN%/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DapexaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/dapexa/deploy/landing;
    index index.html;
    location ^~ /static/ {
        alias /var/www/dapexa/static/;
        autoindex off;
        expires 1h;
        limit_except GET HEAD { deny all; }
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { return 404; }
}

server {
    listen 443 ssl;
    server_name %PANEL_DOMAIN%;
    server_tokens off;
    client_max_body_size 50M;
    access_log /var/log/nginx/dapexa-access.log dapexa_safe;
    error_log /var/log/nginx/dapexa-error.log warn;

    ssl_certificate /etc/letsencrypt/live/%PANEL_DOMAIN%/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/%PANEL_DOMAIN%/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DapexaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /static/ {
        alias /var/www/dapexa/static/;
        autoindex off;
        expires 1h;
        limit_except GET HEAD { deny all; }
    }

    # Only Django can authorize an internal redirect into this location.
    location ^~ /_protected_media/ {
        internal;
        alias /var/www/dapexa/files/;
        disable_symlinks on;
        autoindex off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
        limit_except GET HEAD { deny all; }
    }

    location ~ /\. { return 404; }

    # /files/ goes to Django for authorization; there is no public media alias.
    location / {
        proxy_pass http://dapexa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}
