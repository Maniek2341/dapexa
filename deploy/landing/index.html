<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dapexa — panel do zarządzania firmą.">
  <title>Dapexa.com - Zarzadzaj swoja firma</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #13213a; background: #f5f8ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid #e3eaf7; border-radius: 24px; background: #fff; box-shadow: 0 24px 80px #163d7714; text-align: center; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -.05em; }
    p { margin: 16px 0 28px; color: #58677f; font-size: 1.1rem; line-height: 1.7; }
    a { display: inline-block; padding: 13px 22px; border-radius: 12px; color: white; background: linear-gradient(120deg, #08b8ee, #1468f5 60%, #8449ed); font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #13213a; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/static/assets/img/logo.png" alt="Logo Dapexa">
    <h1>Dapexa</h1>
    <p>Zarządzaj swoją firmą w jednym miejscu. Panel Dapexa jest dostępny pod osobnym adresem.</p>
    <a href="https://panel.dapexa.com/">Przejdź do panelu</a>
  </main>
</body>
</html>
