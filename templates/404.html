<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nie znaleziono strony</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>
:root{--bg:#0b0f19;--card:#141c2e;--border:#29344a;--text:#edf0f6;--muted:#9aa5b8;--orange:#ff7a00}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#192238 0,#0b0f19 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:1.5rem}.error-card{width:min(560px,100%);text-align:center;background:rgba(20,28,46,.94);border:1px solid var(--border);border-radius:22px;padding:3rem 2rem;box-shadow:0 24px 70px #0005}.error-icon{width:72px;height:72px;margin:0 auto 1.4rem;border-radius:20px;display:grid;place-items:center;color:#ff9a32;background:rgba(255,122,0,.14);font-size:2rem}.code{font-size:5rem;line-height:1;font-weight:900;letter-spacing:-.08em;color:var(--orange)}h1{font-size:1.55rem;margin:1rem 0 .65rem}p{color:var(--muted);line-height:1.6;margin:0 auto 1.7rem;max-width:420px}.actions{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:11px;padding:.7rem 1rem;text-decoration:none;font-weight:800}.btn-main{background:linear-gradient(135deg,#ff7900,#ff9f2f);color:#fff}.btn-secondary{border:1px solid var(--border);color:var(--text)}.btn:hover{filter:brightness(1.1);color:#fff}</style></head><body><main class="error-card"><div class="error-icon"><i class="bi bi-compass"></i></div><div class="code">404</div><h1>Nie znaleziono strony</h1><p>Adres, którego szukasz, nie istnieje albo został przeniesiony. Wróć do panelu i spróbuj ponownie.</p><div class="actions"><a class="btn btn-main" href="{% if request.user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}"><i class="bi bi-house"></i>{% if request.user.is_authenticated %}Strona główna{% else %}Logowanie{% endif %}</a><a class="btn btn-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left"></i>Wróć</a></div></main></body></html>
