{% extends "app/core/base.html" %}
{% block content %}
<style>
.support-page .btn-orange{background:linear-gradient(135deg,#08b8ee 0%,#1468f5 52%,#9b4dff 100%);border:1px solid #ff8a17;color:#fff;border-radius:12px;font-weight:800;padding:.7rem 1.1rem;box-shadow:0 8px 20px rgba(20,104,245,.18)}
.support-page .btn-orange:hover{color:#fff;filter:brightness(1.08)}
</style>
<div class="support-page">
<div class="page-header mb-4"><h1>Nowe zgłoszenie wsparcia</h1><p class="text-muted">Opisz problem — zespół wsparcia wróci z odpowiedzią.</p></div>
<form method="post" class="card shadow-sm"><div class="card-body p-4">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}
  <div class="d-flex gap-2 pt-2"><button class="btn-orange" type="submit"><i class="bi bi-send me-1"></i>Wyślij zgłoszenie</button><a class="btn btn-outline-light" href="{% url 'support_list' %}">Anuluj</a></div>
</div></form>
</div>
{% endblock %}
