{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusinessManager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome dla ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="{% static 'assets/panel/toastr/toastr.css' %}" rel="stylesheet"/>
    <script>
        let messages = [];
        {% if messages %}
        {% for message in messages %}
        messages.push({
            'tag': '{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}',
            'data': '{{ message|safe }}'
        })
        {% endfor %}
        {% endif %}
    </script>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-color: var(--light-color);
        }
        
        .auth-container {
            display: flex;
            min-height: 100vh;
        }
        
        .auth-form-section {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: white;
        }
        
        .auth-image-section {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .auth-image-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.8) 0%, rgba(63, 55, 201, 0.8) 100%);
        }
        
        .logo {
            max-width: 180px;
            margin-bottom: 2.5rem;
        }
        
        .form-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        
        .form-subtitle {
            color: var(--gray-color);
            margin-bottom: 2rem;
        }
        
        .form-step {
            display: none;
        }
        
        .form-step.active {
            display: block;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .step-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #dee2e6;
            z-index: 1;
            transform: translateY(-50%);
        }
        
        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #dee2e6;
            color: var(--gray-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            font-weight: 600;
        }
        
        .step.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .step.completed {
            background-color: var(--accent-color);
            color: white;
        }
        
        .step-label {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: var(--gray-color);
            font-size: 0.875rem;
        }
        
        .step.active .step-label,
        .step.completed .step-label {
            color: var(--dark-color);
            font-weight: 500;
        }
        
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(72, 149, 239, 0.25);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.6rem;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        
        @media (max-width: 992px) {
            .auth-container {
                flex-direction: column;
            }
            
            .auth-image-section {
                display: none;
            }
            
            .auth-form-section {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="{% static 'assets/panel/jquery/jquery.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'assets/panel/toastr/toastr.min.js' %}"></script>
    
    <script>
        toastr.options = {
          "closeButton": true,
          "newestOnTop": true,
          "progressBar": true,
          "positionClass": "toast-top-right",
          "preventDuplicates": false,
          "timeOut": "10000",
          "extendedTimeOut": "2000"
        }
      </script>
      <script>
        messages.forEach(function(msg){
            try {
                let message = JSON.parse(msg.data);
            toastr[msg.tag](message.body, message.title)
            } catch (e){
                toastr[msg.tag](msg.data)
                console.warn("Something go wrong with the notification ;-(")
            }
      
        });
      </script>
      
</body>
</html>
